name: Install failure
description: The installer (winget-app-install.ps1) failed or stopped early on a machine.
title: "Install failure: exit code <code> on <target>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The installer prints everything this form asks for at the end of a failed run: the exit code, the installer build and the path of its log file.

        **This repository is public, and so is this issue.** A PowerShell transcript starts with a header that names the computer, the signed-in account and the account that ran the installer (Username, RunAs User, Machine). Before you paste or attach a log, delete that header block (the lines between the first two rows of asterisks) or replace the names in it, and check the rest of the log for account or computer names. If you cannot share a log publicly, say so below and send it to the maintainer privately instead.

        Logs are in `C:\ProgramData\winget-app-setup\logs`. Each run writes `install-<date>-<time>.log`; a run started from Windows PowerShell 5.1 also writes `install-<date>-<time>-bootstrap.log` (the PowerShell 7 setup), and a PowerShell 7 MSI install writes `pwsh-msi-<date>-<time>-<attempt>.log`. Standard users can open them by full path, for example from File Explorer's address bar.
  - type: input
    id: exit-code
    attributes:
      label: Exit code
      description: From "The installer stopped early with exit code N", or `$LASTEXITCODE` after the run. 1 = an app failed, elevation was not available, a pre-flight check or the PowerShell 7 setup failed; 2 = winget unavailable or broken; 3 = app catalog invalid; 5 = the run was aborted.
      placeholder: "2"
    validations:
      required: true
  - type: input
    id: build-id
    attributes:
      label: Installer build
      description: The "Installer build:" line from the end of the run or the start of the log.
      placeholder: 1.0.0+0123abcd
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      description: How the installer ran on this machine.
      options:
        - Cross-user elevation (an admin account elevated on another user's session)
        - Same account, elevated
        - Fresh machine, started from Windows PowerShell 5.1
        - Unattended as SYSTEM (RMM, for example Endpoint Central)
        - Other (describe below)
    validations:
      required: true
  - type: dropdown
    id: start
    attributes:
      label: How it was started
      options:
        - irm | iex one-liner
        - Local file (pwsh -File .\winget-app-install.ps1)
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The error lines, the failed-installations table, and anything you saw that the log does not show.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log file
      description: Attach the log file(s) or paste the relevant part, with the transcript header removed or redacted (see above).
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed or redacted the transcript header and any other account or computer names in what I pasted or attached.
          required: true
