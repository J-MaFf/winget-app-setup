name: Install failure
description: The installer (winget-app-install.ps1) failed or stopped early on a machine.
title: "Install failure: exit code <code> on <target>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The installer prints everything this form asks for at the end of a failed run: the exit code, the installer build, the path of its log file, and the command that makes a diagnostics bundle.

        **Attach a diagnostics bundle.** On the PC where the run failed, run this in PowerShell (started as administrator, so it can read everything), then attach the `.zip` file whose path it prints (on the user's Desktop, or in `C:\Users\Public\Documents` when run as SYSTEM or as another admin account):

        ```powershell
        & ([scriptblock]::Create((irm "https://raw.githubusercontent.com/J-MaFf/winget-app-setup/refs/heads/main/winget-app-install.ps1"))) -CollectDiagnostics
        ```

        It installs and changes nothing, and works when winget does not. The bundle holds the latest run's logs, last-run.json and the state of winget, App Installer, the Windows App Runtime and Winget-AutoUpdate, with account names, the computer name, user profile folders and the SIDs of real accounts replaced by placeholders such as `<user1>` and `<computer1>`. Look through it before you attach it. Its `system.txt` has the Windows build and the elevation style asked for below.

        **This repository is public, and so is this issue.** A PowerShell transcript starts with a header that names the computer, the signed-in account and the account that ran the installer (Username, RunAs User, Machine). Before you paste or attach a log, delete that header block (the lines between the first two rows of asterisks) or replace the names in it, and check the rest of the log for account or computer names. Installer logs name them too: an MSI log lists them in the properties at its end (LogonUser, USERNAME, ComputerName and others), and most installer logs contain paths under `C:\Users\<name>`. If you cannot share a log publicly, say so below and send it to the maintainer privately instead.

        If you cannot make a bundle, attach the logs instead. They are in `C:\ProgramData\winget-app-setup\logs`. Each run writes `install-<date>-<time>.log`; a run started from Windows PowerShell 5.1 also writes `install-<date>-<time>-bootstrap.log` (the PowerShell 7 setup), a PowerShell 7 MSI install writes `pwsh-msi-<date>-<time>-<attempt>.log`, and each app install writes its installer's own log, `winget-install-<package id>-<date>-<time>.log`, which a failed app's reason in the summary names. Attach the installer log of each app that failed. Standard users can open them by full path, for example from File Explorer's address bar.
  - type: input
    id: exit-code
    attributes:
      label: Exit code
      description: 'From "The installer stopped early with exit code N", the `RESULT: exit=N` line near the end of the run, or `$LASTEXITCODE` after the run. 1 = an app failed or a pre-flight check failed; 2 = winget unavailable or broken, or turned off by Group Policy; 3 = app catalog invalid; 4 = administrator rights required (the UAC prompt was declined, the run was non-interactive and not elevated, or Group Policy''s execution policy kept the elevated window from running the installer); 5 = the run was aborted, or PowerShell ran the installer in Constrained Language Mode (an App Control for Business or AppLocker policy); 6 = another run of the installer was in progress on this PC, so this run changed nothing; 7 = the PowerShell 7 setup failed, or Group Policy''s execution policy for PowerShell 7 keeps it from running the installer; 8 = the apps installed, but automatic updates (Winget-AutoUpdate) are not set up, will not run, or could not be checked (see the "Auto-updates:" line in the summary); 3010 = success, but a restart is required to finish.'
      placeholder: "2"
    validations:
      required: true
  - type: input
    id: build-id
    attributes:
      label: Installer build
      description: The "Installer build:" line from the end of the run or the start of the log.
      placeholder: 1.0.0+0123abcd
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      description: Where the installer was started. Which account ran it goes in "Elevation style" below.
      options:
        - By hand, from Windows PowerShell 5.1 (a fresh machine without PowerShell 7)
        - By hand, from PowerShell 7
        - Unattended, from an RMM tool (for example Endpoint Central)
        - Other (describe below)
    validations:
      required: true
  - type: dropdown
    id: start
    attributes:
      label: How it was started
      options:
        - irm | iex one-liner
        - Local file (pwsh -File .\winget-app-install.ps1)
        - Other (describe below)
    validations:
      required: true
  - type: dropdown
    id: elevation
    attributes:
      label: Elevation style
      description: Which account ran the installer with administrator rights. The diagnostics bundle's system.txt says it ("Elevation style"), and a transcript header shows it too (Username is the signed-in user, RunAs User the account that ran the installer).
      options:
        - Same-user (the signed-in user is an administrator and elevated)
        - Cross-user (another admin account elevated on the signed-in user's session)
        - SYSTEM (an RMM tool such as Endpoint Central, or a scheduled task)
        - Not elevated (the run stopped before elevating)
        - Not sure
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: windows-build
    attributes:
      label: Windows build
      description: The "Build:" line of the diagnostics bundle's system.txt, or what `winver` shows (OS Build).
      placeholder: "26100.4061"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The error lines, the failed-installations table, and anything you saw that the log does not show.
      render: text
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics bundle
      description: Attach the winget-app-setup-diagnostics-<date>-<time>.zip that -CollectDiagnostics made (see above). If you could not make one, say why.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log file
      description: Only when you could not attach a diagnostics bundle - the bundle already has the logs. Attach the log file(s) or paste the relevant part, with the transcript header removed or redacted (see above).
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I looked through the diagnostics bundle, and removed or redacted the transcript header and any other account or computer names in anything else I pasted or attached.
          required: true
