# TEMPORARY (bead wgt-gq8.42): gathers the facts the opt-in Microsoft.WinGet.Client engine needs
# from a real runner before its code lands - the PowerShell Gallery package's size, SHA256 and
# file signatures, whether its native engine needs the VC++ runtime, and what the cmdlets return
# when run as SYSTEM. It never fails the PR (every step catches and reports) and is deleted by the
# commit that adds the engine.
name: Probe WinGet client module

on:
  pull_request:
    paths:
      - '.github/workflows/probe-winget-client.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      MODULE_VERSION: '1.29.380'
    steps:
      - name: Download, hash and inspect the package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ver = $env:MODULE_VERSION
          $root = 'C:\wgc-probe'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $pkg = Join-Path $root "microsoft.winget.client.$ver.nupkg"
          try {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            Invoke-WebRequest -Uri "https://www.powershellgallery.com/api/v2/package/Microsoft.WinGet.Client/$ver" -OutFile $pkg -UseBasicParsing -ErrorAction Stop
            "DOWNLOAD seconds=$([int]$sw.Elapsed.TotalSeconds)"
            $bytes = [IO.File]::ReadAllBytes($pkg)
            "PIN Size=$($bytes.Length)"
            "PIN Sha256=$((Get-FileHash -LiteralPath $pkg -Algorithm SHA256).Hash)"
            $sha512 = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash($bytes))
            "LOCAL Sha512(base64)=$sha512"
          }
          catch { "DOWNLOAD FAILED: $($_.Exception.Message)" }
          try {
            $meta = Invoke-WebRequest -Uri "https://www.powershellgallery.com/api/v2/Packages(Id='Microsoft.WinGet.Client',Version='$ver')" -UseBasicParsing -ErrorAction Stop
            $xml = [xml]$meta.Content
            foreach ($n in 'PackageHash', 'PackageHashAlgorithm', 'PackageSize', 'Published', 'IsPrerelease') {
              $node = $xml.SelectSingleNode("//*[local-name()='$n']")
              "GALLERY $n=$($node.InnerText)"
            }
            $galleryHash = $xml.SelectSingleNode("//*[local-name()='PackageHash']").InnerText
            "GALLERY hash matches local: $($galleryHash -eq $sha512)"
          }
          catch { "GALLERY METADATA FAILED: $($_.Exception.Message)" }
          try {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [IO.Compression.ZipFile]::OpenRead($pkg)
            $dest = Join-Path $root 'Microsoft.WinGet.Client'
            foreach ($e in $zip.Entries) {
              $name = [Uri]::UnescapeDataString($e.FullName)
              "ENTRY $($e.Length) $name"
              if ($name -match '^(\[Content_Types\]\.xml|_rels/|package/)' -or $name.EndsWith('/')) { continue }
              $target = Join-Path $dest ($name -replace '/', '\')
              New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null
              [IO.Compression.ZipFileExtensions]::ExtractToFile($e, $target, $true)
            }
            $zip.Dispose()
            Get-ChildItem -LiteralPath $dest -Recurse -File | Where-Object { $_.Extension -in '.dll', '.psd1', '.psm1', '.ps1xml', '.cat', '.ps1', '.winmd' } | ForEach-Object {
              $sig = Get-AuthenticodeSignature -LiteralPath $_.FullName
              $cn = if ($sig.SignerCertificate) { $sig.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) } else { '' }
              $rel = $_.FullName.Substring($dest.Length + 1)
              "SIG $($sig.Status) [$cn] $($_.Length) $((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash) $rel"
            }
            Get-ChildItem -LiteralPath $dest -Recurse -File -Filter *.dll | ForEach-Object {
              $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($_.FullName))
              $crt = @('VCRUNTIME140.dll', 'VCRUNTIME140_1.dll', 'MSVCP140.dll', 'api-ms-win-crt-runtime-l1-1-0.dll', 'ucrtbase.dll') | Where-Object { $text.IndexOf($_, [StringComparison]::OrdinalIgnoreCase) -ge 0 }
              if ($crt) { "CRT-IMPORT-STRINGS $($_.FullName.Substring($dest.Length + 1)): $($crt -join ', ')" }
            }
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vs = & $vswhere -latest -property installationPath
              $dumpbin = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
              if ($dumpbin) {
                foreach ($arch in 'x64', 'arm64', 'x86') {
                  Get-ChildItem -LiteralPath $dest -Recurse -File -Filter *.dll | Where-Object { $_.FullName -match "\\$arch\\" } | ForEach-Object {
                    "DUMPBIN $arch $($_.Name):"
                    & $dumpbin.FullName /nologo /dependents $_.FullName | Where-Object { $_ -match '\.dll' } | ForEach-Object { "    $($_.Trim())" }
                  }
                }
              }
              else { 'DUMPBIN not found' }
            }
            Get-ChildItem -LiteralPath $dest -Directory -Recurse | ForEach-Object { "DIR $($_.FullName.Substring($dest.Length + 1))" }
          }
          catch { "EXTRACT FAILED: $($_.Exception.Message)" }
          "VC++ runtime present: vcruntime140=$(Test-Path "$env:windir\System32\vcruntime140.dll") vcruntime140_1=$(Test-Path "$env:windir\System32\vcruntime140_1.dll") msvcp140=$(Test-Path "$env:windir\System32\msvcp140.dll")"
          "pwsh: $((Get-Command pwsh).Source) $($PSVersionTable.PSVersion)"
          "App Installer: $((Get-AppxPackage -AllUsers -Name Microsoft.DesktopAppInstaller | ForEach-Object { $_.Version }) -join ', ')"
          "winget: $(winget --version 2>&1)"
          exit 0

      - name: Run the module as SYSTEM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $root = 'C:\wgc-probe'
          $manifest = Join-Path $root 'Microsoft.WinGet.Client\Microsoft.WinGet.Client.psd1'
          $log = Join-Path $root 'system-probe.log'
          $script = Join-Path $root 'system-probe.ps1'
          $body = @'
          param([string]$Manifest, [string]$Log)
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          function Out-Probe([string]$Line) { Add-Content -LiteralPath $Log -Value $Line -Encoding utf8 }
          function Format-Chain($e) {
            $parts = @(); $x = $e; $i = 0
            while ($x -and $i -lt 6) { $parts += $x.GetType().FullName + ' (' + ('0x{0:X8}' -f $x.HResult) + '): ' + $x.Message; $x = $x.InnerException; $i++ }
            $parts -join ' <- '
          }
          function Invoke-Probe([string]$Name, [scriptblock]$Body) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            try {
              $r = & $Body
              Out-Probe "$Name OK ($([int]$sw.Elapsed.TotalSeconds) s): $(@($r) | ConvertTo-Json -Depth 4 -Compress)"
            }
            catch { Out-Probe "$Name THREW ($([int]$sw.Elapsed.TotalSeconds) s): $(Format-Chain $_.Exception)" }
          }
          Out-Probe "whoami=$([Security.Principal.WindowsIdentity]::GetCurrent().Name) ps=$($PSVersionTable.PSVersion) apartment=$([Threading.Thread]::CurrentThread.GetApartmentState()) arch=$([Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
          try {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $m = Import-Module -Name $Manifest -PassThru -Force
            Out-Probe "IMPORT OK ($([int]$sw.Elapsed.TotalSeconds) s): $($m.Name) $($m.Version) $($m.ModuleBase)"
          }
          catch { Out-Probe "IMPORT THREW: $(Format-Chain $_.Exception)"; exit 3 }
          Invoke-Probe 'Get-WinGetVersion' { Get-WinGetVersion }
          Invoke-Probe 'Get-WinGetPackage Microsoft.PowerShell' { Get-WinGetPackage -Id Microsoft.PowerShell -MatchOption Equals | Select-Object Id, Name, InstalledVersion, Source, IsUpdateAvailable }
          Invoke-Probe 'Get-WinGetPackage 7zip.7zip (source winget)' { Get-WinGetPackage -Id 7zip.7zip -MatchOption Equals -Source winget | Select-Object Id, InstalledVersion, Source }
          Invoke-Probe 'Get-WinGetPackage Not.A.Package' { Get-WinGetPackage -Id Not.A.Package.Xyz -MatchOption Equals -Source winget | Select-Object Id }
          Invoke-Probe 'Find-WinGetPackage Klocman.BulkCrapUninstaller' { Find-WinGetPackage -Id Klocman.BulkCrapUninstaller -MatchOption Equals -Source winget | Select-Object Id, Version, Source }
          Invoke-Probe 'Install-WinGetPackage Klocman.BulkCrapUninstaller -Scope System' { Install-WinGetPackage -Id Klocman.BulkCrapUninstaller -MatchOption Equals -Source winget -Scope System -Mode Silent | Select-Object Id, Status, InstallerErrorCode, RebootRequired, @{n='ExtendedHResult';e={ if ($_.ExtendedErrorCode) { '0x{0:X8}' -f $_.ExtendedErrorCode.HResult } }}, CorrelationData }
          Invoke-Probe 'Install-WinGetPackage Klocman.BulkCrapUninstaller again' { Install-WinGetPackage -Id Klocman.BulkCrapUninstaller -MatchOption Equals -Source winget -Scope System -Mode Silent | Select-Object Id, Status, InstallerErrorCode, RebootRequired, @{n='ExtendedHResult';e={ if ($_.ExtendedErrorCode) { '0x{0:X8}' -f $_.ExtendedErrorCode.HResult } }} }
          Invoke-Probe 'Install-WinGetPackage Spotify.Spotify -Scope System (user-only installer)' { Install-WinGetPackage -Id Spotify.Spotify -MatchOption Equals -Source winget -Scope System -Mode Silent | Select-Object Id, Status, InstallerErrorCode, RebootRequired, @{n='ExtendedHResult';e={ if ($_.ExtendedErrorCode) { '0x{0:X8}' -f $_.ExtendedErrorCode.HResult } }} }
          Invoke-Probe 'Install-WinGetPackage Not.A.Package' { Install-WinGetPackage -Id Not.A.Package.Xyz -MatchOption Equals -Source winget -Scope System -Mode Silent | Select-Object Id, Status }
          Invoke-Probe 'Get-WinGetPackage Klocman.BulkCrapUninstaller after install' { Get-WinGetPackage -Id Klocman.BulkCrapUninstaller -MatchOption Equals | Select-Object Id, InstalledVersion, Source }
          $logs = Get-ChildItem -Path "$env:windir\Temp\WinGet", "$env:LOCALAPPDATA\Temp\WinGet" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 10 -ExpandProperty FullName
          Out-Probe "WINGET LOG FILES: $($logs -join '; ')"
          exit 0
          '@
          Set-Content -LiteralPath $script -Value $body -Encoding utf8
          Remove-Item -LiteralPath $log -ErrorAction SilentlyContinue
          $pwsh = (Get-Command pwsh).Source
          $t0 = [Diagnostics.Stopwatch]::StartNew()
          & $pwsh -NoProfile -Command "Import-Module '$manifest'; Get-WinGetVersion" 2>&1 | ForEach-Object { "AS RUNNER ACCOUNT: $_" }
          "AS RUNNER ACCOUNT: child pwsh import + Get-WinGetVersion took $([int]$t0.Elapsed.TotalSeconds) s"
          $action = New-ScheduledTaskAction -Execute $pwsh -Argument "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$script`" -Manifest `"$manifest`" -Log `"$log`""
          $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          Register-ScheduledTask -TaskName 'wgc-probe' -Action $action -Principal $principal -Force | Out-Null
          Start-ScheduledTask -TaskName 'wgc-probe'
          $deadline = (Get-Date).AddMinutes(25)
          Start-Sleep -Seconds 5
          while ((Get-ScheduledTask -TaskName 'wgc-probe').State -eq 'Running' -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 10 }
          $info = Get-ScheduledTaskInfo -TaskName 'wgc-probe'
          "TASK state=$((Get-ScheduledTask -TaskName 'wgc-probe').State) LastTaskResult=$($info.LastTaskResult)"
          if (Test-Path $log) { Get-Content -LiteralPath $log } else { 'no probe log written' }
          exit 0
